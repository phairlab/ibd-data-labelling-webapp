# Configuration for the RMT23345 timeline labeling webapp.
# Edit this file to control which data sources are loaded and which
# fields appear in the event hover tooltip — no code changes needed.

# ─────────────────────────────────────────────────────────────────
# Disease detection.
# Controls how events are flagged as "disease-related" on the timeline.
# All values here are IBD defaults — change them for a different disease.
#
# `keywords`     — regex used when diagnosis_format is "text" (after R prep).
# `icd_prefixes` — code prefixes used when diagnosis_format is "icd_code".
#                  ICD-10 starts with a letter (K50), ICD-9 starts with a digit (555).
# `icd9_dictionary`  / `icd10_dictionary` — paths to lookup CSVs so raw codes are
#                  shown as "K500 - Crohn disease of small intestine" in the tooltip.
#                  Leave blank if dictionaries are not yet downloaded.
# `biologic_atc_codes` / `steroid_atc_codes` — ATC drug codes for prescription detection.
# ─────────────────────────────────────────────────────────────────
disease_detection:
  # Text keyword matching (used when R prep scripts have already converted codes to English)
  keywords: "crohn|ulcerative|inflammatory bowel|ileitis|proctocolitis"

  # ICD code prefix matching (used when raw ICD codes are still in the CSV)
  icd_prefixes:
    - K50    # ICD-10: Crohn's disease
    - K51    # ICD-10: Ulcerative colitis
    - "555"  # ICD-9:  Crohn's disease
    - "556"  # ICD-9:  Ulcerative colitis

  # ICD lookup dictionaries — set paths once downloaded; leave blank to skip enrichment
  # icd9_dictionary:  resources/icd9_dictionary.csv
  # icd10_dictionary: resources/icd10ca_dictionary.csv

  # Prescription detection by ATC drug code (PIN dataset)
  biologic_atc_codes:
    - L04AB04  # adalimumab
    - L04AB02  # infliximab
    - L04AB06  # golimumab
    - L04AB05  # certolizumab pegol
    - L04AA33  # vedolizumab
    - L04AC05  # ustekinumab
    - L04AC18  # risankizumab
    - L04AC24  # mirikizumab
    - L04AF01  # tofacitinib
    - L04AF03  # upadacitinib
  steroid_atc_codes:
    - H02AB04  # methylprednisolone
    - H02AB06  # prednisolone
    - H02AB07  # prednisone

# ─────────────────────────────────────────────────────────────────
# Sources to load.
# Comment out any source block you don't need to reduce server load.
# `file`             — CSV filename inside the data directory.
# `start_date`       — column used as the event start time (assumed UTC).
# `end_date`         — column used as the event end time (assumed UTC).
#                      Use a list to try columns in order; if all are
#                      missing the end time falls back to 23:59 same day.
# `diagnosis_format` — "text" if R prep scripts have already converted
#                      ICD codes to English (default).
#                      "icd_code" if the CSV still has raw codes (e.g. K50.0).
# ─────────────────────────────────────────────────────────────────
sources:
  AMB:
    file: RMT23345_AMB.csv
    start_date: ArriveDt
    end_date:
      - DepartDt
      - DispDt
    diagnosis_format: text

  DAD:
    file: RMT23345_DAD.csv
    start_date: ADMITDATE
    end_date: DISDATE
    diagnosis_format: text

  LAB:
    file: RMT23345_LAB.csv
    start_date: verifyDt
    end_date: verifyDt

  PIN:
    file: RMT23345_PIN.csv
    start_date: DSPN_DATE
    end_date: DSPN_DATE

  CLM:
    file: RMT23345_CLM.csv
    start_date: SE_START_DATE
    end_date: SE_END_DATE
    diagnosis_format: text

  DI:
    file: RMT23345_DI.csv
    start_date: SVC_DT
    end_date: SVC_DT

# ─────────────────────────────────────────────────────────────────
# Fields shown when you hover over, for each source.
# `column` must match the exact CSV column header.
# `label`  is the human-readable name shown in the tooltip.
# ─────────────────────────────────────────────────────────────────
display:
  AMB:
    - column: INST
      label: "Hospital"
    - column: DXCODE1
      label: "Diagnosis"
    - column: PROCCODE1
      label: "Procedure"
    - column: ABSTRACT_TYPE
      label: "Visit Type"

  DAD:
    - column: INST
      label: "Hospital"
    - column: DXCODE1
      label: "Diagnosis"
    - column: CMG
      label: "CMG"
    - column: ADMITCAT
      label: "Admit Category"

  LAB:
    - column: TEST_NM
      label: "Test"
    - column: TEST_RSLT
      label: "Result"
    - column: TEST_UOFM
      label: "Unit"
    - column: TEST_ABNRML_FLAG
      label: "Abnormal"

  PIN:
    - column: INGREDIENT
      label: "Drug"
    - column: STRENGTH
      label: "Strength"
    - column: STRENGTH_UNIT
      label: "Unit"
    - column: BRAND_NAME
      label: "Brand"

  CLM:
    - column: HLTH_SRVC_CCPX_CODE
      label: "Service Code"
    - column: DXCODE
      label: "Diagnosis"
    - column: SECTOR
      label: "Sector"
    - column: DOCTOR_CLASS
      label: "Doctor Type"

  DI:
    - column: CPEL_CATLG_DESC
      label: "Exam"
    - column: CPEL_MDLTY_CD
      label: "Modality"

    

      
